<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container" style="margin-top: 30px; max-width: 700px;">
    <h3 class="text-center font-weight-bold">PLAYFAIR CIPHER</h3>
    <hr>
    
    <table class="table table-bordered">
        <tbody>
            <tr>
                <td class="bg-light"><strong style="color: blue;">ENCRYPTION</strong></td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/playfair/encrypt" onsubmit="return validateKey('inputKeyPlain')">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus value="{{ original_text if encrypted_text else '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" id="inputKeyPlain" name="inputKeyPlain" placeholder="Input Key (Must be string)" required value="{{ key if encrypted_text else '' }}">
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                    {% if encrypted_text %}
                    <div class="mt-3 alert alert-success" style="word-break: break-all;">
                        <strong>text:</strong> {{ original_text }}<br>
                        <strong>key:</strong> {{ key }}<br>
                        <strong>encrypted text:</strong> {{ encrypted_text }}
                    </div>
                    {% endif %}
                </td>
            </tr>

            <tr>
                <td class="bg-light"><strong style="color: blue;">DECRYPTION</strong></td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/playfair/decrypt" onsubmit="return validateKey('inputKeyCipher')">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required value="{{ original_text if decrypted_text else '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" id="inputKeyCipher" name="inputKeyCipher" placeholder="Input Key (Must be string)" required value="{{ key if decrypted_text else '' }}">
                        </div>
                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                    {% if decrypted_text %}
                    <div class="mt-3 alert alert-info" style="word-break: break-all;">
                        <strong>text:</strong> {{ original_text }}<br>
                        <strong>key:</strong> {{ key }}<br>
                        <strong>decrypted text:</strong> {{ decrypted_text }}
                    </div>
                    {% endif %}
                </td>
            </tr>
        </tbody>
    </table>
    
    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">Quay lại Menu Chính</a>
    </div>
</div>

<script>
    function validateKey(inputId) {
        var keyVal = document.getElementById(inputId).value.trim();
        if (!isNaN(keyVal) && keyVal !== "") {
            alert("LỖI RÀNG BUỘC: Thuật toán PLAYFAIR bắt buộc Key phải là CHỮ (Chuỗi ký tự), không được nhập số!");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
