<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Playfair Cipher - Dark Blue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>
    <style>
        body { background: linear-gradient(135deg, #0b111e 0%, #111a2e 50%, #070b14 100%); font-family: 'Segoe UI', sans-serif; color: #e2e8f0; min-height: 100vh; padding: 40px 0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 20px; padding: 35px; backdrop-filter: blur(15px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); margin-bottom: 30px; }
        h2.title { color: #38bdf8; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); margin-bottom: 30px; }
        .section-header { color: #38bdf8; font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .form-control { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); color: #fff; border-radius: 10px; }
        .btn-neon-blue { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: none; color: white; font-weight: 700; padding: 10px 25px; border-radius: 10px; width: 100%; transition: 0.3s; }
        .alert-result { background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; color: #38bdf8; border-radius: 12px; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="title">Playfair Cipher</h2>
        <div class="row text-left">
            <div class="col-md-6">
                <div class="glass-card h-100">
                    <div class="section-header"><i class="fas fa-th mr-2"></i> Encryption</div>
                    <form action="/playfair/encrypt" method="post">
                        <div class="form-group"><label>Plain Text:</label><textarea class="form-control" name="inputPlainText" rows="3">{{ original_text if original_text }}</textarea></div>
                        <div class="form-group"><label>Key (Matrix String):</label><input type="text" class="form-control" name="inputKeyPlain" value="{{ key if key }}"></div>
                        <button type="submit" class="btn-neon-blue">ENCRYPT</button>
                    </form>
                    {% if encrypted_text %}<div class="alert-result"><strong>Result:</strong><br>{{ encrypted_text }}</div>{% endif %}
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card h-100">
                    <div class="section-header"><i class="fas fa-vector-square mr-2"></i> Decryption</div>
                    <form action="/playfair/decrypt" method="post">
                        <div class="form-group"><label>Cipher Text:</label><textarea class="form-control" name="inputCipherText" rows="3">{{ original_text if original_text }}</textarea></div>
                        <div class="form-group"><label>Key (Matrix String):</label><input type="text" class="form-control" name="inputKeyCipher" value="{{ key if key }}"></div>
                        <button type="submit" class="btn-neon-blue" style="background: linear-gradient(135deg, #059669 0%, #047857 100%);">DECRYPT</button>
                    </form>
                    {% if decrypted_text %}<div class="alert-result" style="border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1);"><strong>Result:</strong><br>{{ decrypted_text }}</div>{% endif %}
                </div>
            </div>
        </div>
        <div class="mt-5"><a href="/" class="btn btn-outline-info" style="border-radius: 10px; padding: 10px 25px;">Quay lại Menu Chính</a></div>
    </div>
</body>
</html>
